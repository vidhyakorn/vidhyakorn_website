# Spectra — https://github.com/JoeYang1412/hugo-theme-spectra
# Started from the theme's exampleSite/hugo.toml. Spectra ships its own defaults
# in themes/hugo-theme-spectra/hugo.toml, which Hugo merges automatically.

baseURL = 'https://vidhyakorn.github.io/vma/'
locale = 'en'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'VMA'
theme = 'hugo-theme-spectra'

# Obsidian note templates live in content/_templates/ so they are visible
# in the vault, but they are not pages and must never be published.
ignoreFiles = ['content/_templates/.*']

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  series = 'series'

[params]
  # === Identity ===
  description = 'Vidhyakorn Mahd-Adam'
  author = 'Vidhyakorn Mahd-Adam'
  tagline = ' in progress '
  bio = 'Research Assistant at MORU, Bangkok.'
  avatar = '/img/profile.jpg'
  # Banner background image. Left unset, the theme draws its own gradient.
  # banner = '/img/banner.webp'

  # === Banner Text ===
  bannerTitle = 'τὸ τέλος τοῦ βαλάνου ἐστὶ τὸ γενέσθαι δρῦς'
  bannerHighlight = ' '
  bannerSubtitle = ' "an acorn’s telos is to become an oak tree" — Aristotle  '

  # === Content Limits ===
  homepagePostsLimit = 10
  cardSummaryLength = 150
  relatedPostsLimit = 3
  cardImageQuality = 80
  coverImageQuality = 85

  # === Feature Toggles ===
  enableLoadingAnimation = true
  enableMouseGlow = true
  showBanner = true
  showReadingProgress = true
  enableLightbox = true
  showScrollTop = true
  enableSearch = true
  showRelatedPosts = true
  showSeriesNav = true
  enableCodeCopy = true
  enableScrollAnimation = true

  # === Fonts (this REPLACES the theme's whole Google Fonts URL) ===
  googleFontsURL = 'https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap'

  # === Your own CSS/JS (loaded after the theme, so it overrides) ===
  customCSS = ['css/custom.css']
  # customJS  = ['js/custom.js']

  # === Publication metadata lookups ===
  # Crossref serves identified requests from a faster pool.
  crossrefMailto = 'vidhyakornadam@gmail.com'

  # === Share ===
  sharePlatforms = ['bluesky', 'linkedin']

  # === Academic profiles ===
  # TODO: paste your URLs and uncomment. LinkedIn has a built-in icon;
  # ORCID and Google Scholar fall back to a generic external-link icon.
  [[params.social]]
  name = "ORCID"
  url = "https://orcid.org/0009-0008-2468-8870"
  [[params.social]]
  name = "Google Scholar"
  url = "https://scholar.google.com/citations?hl=en&user=jgY_JOAAAAAJ"
  [[params.social]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/vidhyakorn"

  # === Style Overrides ===
  [params.style]
    fontDisplay = "'IM Fell English', Georgia, 'Times New Roman', serif"
    fontBody = "'EB Garamond', Georgia, 'Times New Roman', serif"
    fontMono = "'JetBrains Mono', ui-monospace, SFMono-Regular, monospace"
    colorAccent = '#1A2CA3'
    colorAccentWarm = '#CD071F'
    colorAccentSoft = '#F68048'
    bgPrimary = '#FFFFFF'
    bgSurface = '#FFFFFF'
    textPrimary = '#141A2E'
    bannerImageText = '#FFFFFF'
    bannerImageGradient = 'linear-gradient(135deg, #0D1A63 0%, #2845D6 55%, #F68048 100%)'

  [params.sidebar]
    showAllPosts = true
    showCategories = true
    showTags = true
    showRecent = true
    categoryLimit = 5
    tagsLimit = 20
    recentLimit = 5

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    lineNos = false
    lineNumbersInTable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]

[[menu.main]]
  name = "Home"
  pageRef = "/"
  weight = 1
  pre = "⌂"
[[menu.main]]
  name = "About"
  pageRef = "/about"
  weight = 3
  pre = "◉"
[[menu.main]]
  name = "Writing"
  pageRef = "/posts"
  weight = 2
  pre = "✎"
[[menu.main]]
  name = "Publications"
  pageRef = "/posts"
  weight = 2
  pre = "✎"

[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
    pattern = "2006"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
